<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal</title>

<style>
body {
  background: black;
  color: red;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

#text {
  font-size: 32px;
  transition: opacity 0.3s ease;
  text-shadow: 0 0 10px red;
}
</style>
</head>

<body>

<div id="text">PYTHON DEVELOPER</div>

<script>
const texts = [
  "PYTHON DEVELOPER",
  "WEB DEVELOPER",
  "AUTOMATION ARCHITECT",
  "AI WHISPERER",
  "DARK SIDE OF THE TERMINAL"
];

let i = 0;
const el = document.getElementById("text");

setInterval(() => {
  el.style.opacity = 0;

  setTimeout(() => {
    i = (i + 1) % texts.length;
    el.textContent = texts[i];
    el.style.opacity = 1;
  }, 300);

}, 2000);
</script>

</body>
</html>
