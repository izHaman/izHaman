<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: black;
  color: red;
  font-family: monospace;
  text-align: center;
  margin-top: 100px;
}
</style>
</head>

<body>

<h1 id="text">PYTHON DEVELOPER</h1>

<script>
const texts = [
  "PYTHON DEVELOPER",
  "WEB DEVELOPER",
  "AUTOMATION ARCHITECT",
  "AI WHISPERER",
  "DARK SIDE OF THE TERMINAL"
];

let i = 0;

setInterval(() => {
  document.getElementById("text").style.opacity = 0;

  setTimeout(() => {
    i = (i + 1) % texts.length;
    document.getElementById("text").innerText = texts[i];
    document.getElementById("text").style.opacity = 1;
  }, 300);

}, 2000);
</script>

</body>
</html>
