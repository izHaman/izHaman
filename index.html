<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap');

body {
  background: #050505;
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(255,0,0,0.08), transparent 60%);
  filter: blur(40px);
}

#text {
  font-family: 'Metal Mania', cursive;
  font-size: 42px;
  color: #ff0000;
  letter-spacing: 3px;

  text-shadow:
    0 0 6px #ff0000,
    0 0 18px #ff0000,
    0 0 30px rgba(255,0,0,0.6);

  transition: opacity 0.9s ease-in-out;
  opacity: 1;

  animation: flicker 6s infinite;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  48% { opacity: 0.95; }
  50% { opacity: 0.7; }
  52% { opacity: 1; }
}
</style>
</head>

<body>

<div id="text">PYTHON DEVELOPER</div>

<script>
const texts = [
  "PYTHON DEVELOPER",
  "WEB DEVELOPER",
  "AUTOMATION ARCHITECT",
  "AI WHISPERER",
  "DARK SIDE OF THE TERMINAL"
];

let i = 0;
const el = document.getElementById("text");

setInterval(() => {
  el.style.opacity = 0;

  setTimeout(() => {
    i = (i + 1) % texts.length;
    el.textContent = texts[i];
    el.style.opacity = 1;
  }, 900);

}, 3200);
</script>

</body>
</html>
